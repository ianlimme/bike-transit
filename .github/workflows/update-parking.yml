name: Update bicycle parking data

on:
  schedule:
    - cron: "0 20 1 * *"   # 1st of each month, 4am Singapore time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download bicycle parking from LTA DataMall
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: |
          python3 -u - <<'PY'
          import json, os, sys, time, datetime, urllib.request, urllib.parse
          from concurrent.futures import ThreadPoolExecutor

          KEY = os.environ.get("LTA_ACCOUNT_KEY", "").strip()
          if not KEY:
              sys.exit("Missing LTA_ACCOUNT_KEY secret.")
          URL = "https://datamall2.mytransport.sg/ltaodataservice/v3/BicycleParking"
          CAP = 500          # most results LTA returns in one call
          calls = 0

          def get(cell):
              lat, lng, half = cell
              # circle that covers the whole square cell
              dist_km = half * 111.32 * 1.415 + 0.05
              q = {"Lat": f"{lat:.5f}", "Long": f"{lng:.5f}", "Dist": f"{dist_km:.2f}"}
              req = urllib.request.Request(URL + "?" + urllib.parse.urlencode(q),
                                           headers={"AccountKey": KEY, "accept": "application/json"})
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return json.load(r).get("value", [])
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(2 * (attempt + 1))

          # Start with big squares over Singapore. Any square that hits the
          # result limit is split into 4 smaller squares and checked again,
          # so busy areas get detail and empty sea costs almost nothing.
          half = 0.03
          cells = []
          lat = 1.20 + half
          while lat - half < 1.48:
              lng = 103.60 + half
              while lng - half < 104.05:
                  cells.append((lat, lng, half))
                  lng += 2 * half
              lat += 2 * half

          seen, wave, started = {}, 0, time.time()
          while cells:
              wave += 1
              if calls + len(cells) > 4000:
                  sys.exit("Too many requests needed, so stopping. Keeping the old file.")
              calls += len(cells)
              with ThreadPoolExecutor(max_workers=6) as ex:
                  results = list(ex.map(get, cells))
              nxt = []
              for (la, lo, h), rows in zip(cells, results):
                  if len(rows) >= CAP and h > 0.0015:
                      q = h / 2
                      nxt += [(la - q, lo - q, q), (la - q, lo + q, q), (la + q, lo - q, q), (la + q, lo + q, q)]
                      continue
                  for r in rows:
                      try:
                          rla, rlo = float(r["Latitude"]), float(r["Longitude"])
                      except (KeyError, TypeError, ValueError):
                          continue
                      # keep only points inside this square, so overlapping circles don't double up
                      if abs(rla - la) <= h + 1e-9 and abs(rlo - lo) <= h + 1e-9:
                          seen[(round(rla, 6), round(rlo, 6), r.get("Description", ""))] = r
              print(f"Round {wave}: checked {len(cells)} areas, {len(nxt)} need more detail, "
                    f"{len(seen)} locations so far, {calls} requests, {time.time() - started:.0f}s")
              cells = nxt

          if len(seen) < 500:
              sys.exit(f"Only {len(seen)} locations found, so something is wrong. Keeping the old file.")

          def num(v):
              try:
                  return int(float(v))
              except (TypeError, ValueError):
                  return 0

          rows = []
          for r in seen.values():
              rows.append([
                  round(float(r["Latitude"]), 6),
                  round(float(r["Longitude"]), 6),
                  r.get("Description", ""),
                  r.get("RackType", ""),
                  num(r.get("RackCount")),
                  1 if str(r.get("ShelterIndicator", "")).upper().startswith("Y") else 0,
                  1 if str(r.get("SharedBicycleParking", "")).lower().startswith("y") else 0,
                  r.get("Type", ""),
              ])
          rows.sort()
          out = {
              "updated": datetime.date.today().isoformat(),
              "source": "LTA DataMall",
              "fields": ["lat", "lng", "name", "rackType", "lots", "sheltered", "shared", "type"],
              "rows": rows,
          }
          with open("parking.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(rows)} bicycle parking locations.")
          PY

      - name: Save the file to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add parking.json
          git diff --cached --quiet || git commit -m "Update bicycle parking data"
          git push
