name: Update bicycle parking data

on:
  schedule:
    - cron: "0 20 1 * *"   # 1st of each month, 4am Singapore time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download bicycle parking from LTA DataMall
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, datetime, urllib.request, urllib.parse

          KEY = os.environ.get("LTA_ACCOUNT_KEY", "").strip()
          if not KEY:
              sys.exit("Missing LTA_ACCOUNT_KEY secret.")
          URL = "https://datamall2.mytransport.sg/ltaodataservice/v3/BicycleParking"

          def get(lat, lng, skip=0):
              q = {"Lat": f"{lat:.5f}", "Long": f"{lng:.5f}", "Dist": "1.5"}
              url = URL + "?" + urllib.parse.urlencode(q) + (f"&$skip={skip}" if skip else "")
              req = urllib.request.Request(url, headers={"AccountKey": KEY, "accept": "application/json"})
              for attempt in range(4):
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          return json.load(r).get("value", [])
                  except Exception as e:
                      if attempt == 3:
                          raise
                      time.sleep(3 * (attempt + 1))

          # Cover Singapore with overlapping 1.5 km circles on a ~2 km grid.
          step = 0.018
          lats = [1.20 + i * step for i in range(int((1.48 - 1.20) / step) + 2)]
          lngs = [103.60 + j * step for j in range(int((104.05 - 103.60) / step) + 2)]
          seen = {}
          for lat in lats:
              for lng in lngs:
                  skip = 0
                  while True:
                      rows = get(lat, lng, skip)
                      for r in rows:
                          try:
                              la, lo = float(r["Latitude"]), float(r["Longitude"])
                          except (KeyError, TypeError, ValueError):
                              continue
                          seen[(round(la, 6), round(lo, 6), r.get("Description", ""))] = r
                      if len(rows) < 500:
                          break
                      skip += 500
                  time.sleep(0.15)

          if len(seen) < 500:
              sys.exit(f"Only {len(seen)} locations found, so something is wrong. Keeping the old file.")

          def num(v):
              try:
                  return int(float(v))
              except (TypeError, ValueError):
                  return 0

          rows = []
          for r in seen.values():
              rows.append([
                  round(float(r["Latitude"]), 6),
                  round(float(r["Longitude"]), 6),
                  r.get("Description", ""),
                  r.get("RackType", ""),
                  num(r.get("RackCount")),
                  1 if str(r.get("ShelterIndicator", "")).upper().startswith("Y") else 0,
                  1 if str(r.get("SharedBicycleParking", "")).lower().startswith("y") else 0,
                  r.get("Type", ""),
              ])
          rows.sort()
          out = {
              "updated": datetime.date.today().isoformat(),
              "source": "LTA DataMall",
              "fields": ["lat", "lng", "name", "rackType", "lots", "sheltered", "shared", "type"],
              "rows": rows,
          }
          with open("parking.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, separators=(",", ":"))
          print(f"Saved {len(rows)} bicycle parking locations.")
          PY

      - name: Save the file to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add parking.json
          git diff --cached --quiet || git commit -m "Update bicycle parking data"
          git push
